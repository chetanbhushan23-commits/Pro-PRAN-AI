name: Fix long news URLs

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch report URL display
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('public/index.html')
          s = p.read_text(encoding='utf-8')
          marker = 'function formatReportText('
          if marker not in s:
              old = "function render(j,s){"
              new_func = r'''function formatReportText(text){
                const raw=String(text||'Decision based on verified data.');
                const escaped=esc(raw);
                return escaped.replace(/https?:\/\/[^\s<]+/g, '<a href="$&" target="_blank" rel="noopener" style="display:inline-block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom">Open Article ↗</a>');
              }
              '''
              if old not in s:
                  raise SystemExit('render marker not found')
              s=s.replace(old, new_func+old, 1)
              old_report="<p>${esc(j.report||'Decision based on verified data.')}</p>"
              new_report="<p>${formatReportText(j.report||'Decision based on verified data.')}</p>"
              if old_report not in s:
                  raise SystemExit('report render marker not found')
              s=s.replace(old_report,new_report,1)
              p.write_text(s,encoding='utf-8')
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "fix: minimize long news URLs in reports"
            git push
          fi
