<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pro-PRAN AI — Stock Research</title>
<style>
:root{--bg:#07111f;--card:#0d1b2d;--line:#20334d;--text:#e8f0fa;--muted:#8fa4bd;--accent:#4da3ff;--good:#35d07f;--bad:#ff6174;--warn:#ffc857}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,sans-serif}header{padding:22px max(20px,calc((100% - 1180px)/2));border-bottom:1px solid var(--line);background:#091626;position:sticky;top:0;z-index:5}h1{margin:0 0 5px;font-size:24px}.sub{color:var(--muted)}main{max-width:1180px;margin:24px auto;padding:0 20px}.search{display:flex;gap:10px;margin-bottom:22px}.search input{flex:1;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;color:var(--text);font-size:16px}.search button{border:0;border-radius:10px;padding:0 24px;background:var(--accent);color:#fff;font-weight:700;cursor:pointer}.status{color:var(--muted);margin:10px 0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}.label{font-size:12px;color:var(--muted);text-transform:uppercase}.value{font-size:21px;font-weight:750;margin-top:7px}.section{margin-top:18px}.section h2{font-size:18px;margin:0 0 10px}.report{white-space:pre-wrap;line-height:1.65;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px}.news-panel{background:#0a141f;border:1px solid #203044;border-radius:18px;overflow:hidden}.news-head{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 12px;border-bottom:1px solid #203044}.news-head-left{min-width:0}.news-title{font-size:17px;font-weight:800;letter-spacing:.04em}.news-subtitle{color:#8797aa;font-size:12px;margin-top:5px}.news-actions{display:flex;align-items:center;gap:10px}.news-more{border:0;background:transparent;color:#9aa8ba;font-size:12px;cursor:pointer;padding:6px}.news-refresh{width:34px;height:34px;border:1px solid #2a394b;border-radius:50%;background:#101c29;color:#aab8c8;cursor:pointer;font-size:17px;line-height:1}.news-refresh:hover,.news-more:hover{color:#fff}.news-list{padding:0 14px}.news-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;padding:15px 2px;border-bottom:1px solid #203044}.news-item:last-child{border-bottom:0}.news-main{min-width:0}.news-headline{display:block;color:#e8edf4;font-weight:650;line-height:1.35;text-decoration:none}.news-headline:hover{color:#9dccff}.news-meta{color:#7f8fa3;font-size:12px;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.news-source{color:#aeb9c7}.news-sentiment{align-self:center;border-radius:999px;padding:5px 10px;font-size:10px;font-weight:800;letter-spacing:.04em;background:#182230;color:#9aa8ba;min-width:68px;text-align:center}.news-sentiment.positive{background:rgba(18,148,99,.16);color:#26d88d}.news-sentiment.negative{background:rgba(220,70,87,.14);color:#ff7180}.news-sentiment.neutral{background:#182230;color:#9aa8ba}.news-empty{padding:22px 2px;color:#8998aa}.hidden-news{display:none}.decision{font-size:25px;font-weight:800}.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}table{width:100%;border-collapse:collapse;background:var(--card);border-radius:12px;overflow:hidden}th,td{text-align:left;padding:11px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-size:12px}.error{color:var(--bad)}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.search{flex-direction:column}.search button{height:48px}.value{font-size:18px}.news-item{grid-template-columns:minmax(0,1fr) auto}}@media(max-width:500px){.grid{grid-template-columns:1fr}.news-item{grid-template-columns:1fr;gap:8px}.news-sentiment{justify-self:start}.news-meta{white-space:normal}}
</style>
</head>
<body>
<header><h1>📊 Pro-PRAN AI</h1><div class="sub">Verified stock research • Technical • Fundamental • News • AI decision</div></header>
<main>
<div class="search"><input id="symbol" value="IDEA" placeholder="Enter NSE symbol e.g. INFY, IDEA, RELIANCE"><button onclick="analyze()">Analyze Stock</button></div>
<div id="status" class="status">Ready</div>
<div id="app"></div>
</main>
<script>
const API='';
let currentNews=[];
function esc(x){return String(x??'N/A').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[m]))}
function relativeTime(date){if(!date)return 'time unavailable';const ts=Date.parse(date);if(!Number.isFinite(ts))return 'time unavailable';const diff=Math.max(0,Date.now()-ts);const mins=Math.floor(diff/60000);if(mins<1)return 'just now';if(mins<60)return `${mins}m ago`;const hrs=Math.floor(mins/60);if(hrs<24)return `${hrs}h ago`;const days=Math.floor(hrs/24);return `${days}d ago`}
function newsSentiment(title){const text=String(title||'').toLowerCase();const positive=/surge|rally|jump|gain|gains|bullish|upgrade|strong|growth|profit|profits|beats|beat|buy|positive|inflow|wins|deal|partnership|approval|approves|record|higher/.test(text);const negative=/fall|falls|drop|drops|decline|declines|bearish|downgrade|weak|loss|losses|miss|misses|sell|negative|outflow|crisis|risk|lower|slump|plunge|debt/.test(text);if(positive&&!negative)return'POSITIVE';if(negative&&!positive)return'NEGATIVE';return'NEUTRAL'}
function sentimentClass(x){return x==='POSITIVE'?'positive':x==='NEGATIVE'?'negative':'neutral'}
function formatNewsDate(date){if(!date)return 'Date N/A';const d=new Date(date);if(Number.isNaN(d.getTime()))return 'Date N/A';return d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'})+' · '+d.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})}
async function analyze(){const s=document.getElementById('symbol').value.trim().toUpperCase();if(!s)return;document.getElementById('status').textContent='Fetching verified data and news…';document.getElementById('app').innerHTML='';try{const r=await fetch(`${API}/api/analyze?symbol=${encodeURIComponent(s)}`);const j=await r.json();if(!j.success)throw Error(j.error||'Analysis failed');render(j,s);document.getElementById('status').textContent=`Analysis completed • ${new Date().toLocaleString()}`}catch(e){document.getElementById('status').innerHTML=`<span class="error">${esc(e.message)}</span>`}}
function render(j,s){const d=j.data||{},q=d.quantData||{},t=q.technicals||{},i=t.indicators||{},f=q.fundamentals?.values||{},sc=d.deterministicScore||{};currentNews=(d.sources||[]).filter(x=>x.title&&x.url).sort((a,b)=>(Date.parse(b.published_at||0)||0)-(Date.parse(a.published_at||0)||0));const rec=(j.report||'').match(/\*\*(BUY|SELL|WAIT)[^*]*\*\*/)?.[1]||'WAIT';const cls=rec==='BUY'?'good':rec==='SELL'?'bad':'warn';document.getElementById('app').innerHTML=`
<section class="section"><div class="card"><div class="label">Executive Summary</div><div class="value">${esc(s)} — ${esc(t.trend||'N/A')}</div><p>${esc(summary(t,f,rec))}</p></div></section>
<section class="section"><h2>Key Metrics Snapshot</h2><div class="grid">${metric('Current Price',money(t.current_price))}${metric('Trend',t.trend)}${metric('RSI (14)',i.RSI_14)}${metric('P/E',f.PE_ratio)}</div></section>
<section class="section"><div class="news-panel"><div class="news-head"><div class="news-head-left"><div class="news-title">MARKET NEWS</div><div class="news-subtitle">Latest verified news for ${esc(s)} • newest first</div></div><div class="news-actions"><button class="news-more" onclick="toggleMoreNews()">More</button><button class="news-refresh" title="Refresh news" aria-label="Refresh news" onclick="refreshNews()">↻</button></div></div><div id="news-list" class="news-list">${renderNewsRows()}</div></div></section>
<section class="section"><h2>Technical Analysis</h2><div class="card"><p><b>EMA Stack:</b> Price ${money(t.current_price)} → EMA20 ${num(i.EMA_20)} → EMA50 ${num(i.EMA_50)} → EMA200 ${num(i.EMA_200)}</p><p><b>Momentum:</b> RSI ${num(i.RSI_14)} • MACD Histogram ${num(i.MACD_Histogram)} • Volume Ratio ${num(i.Volume_Ratio)}</p><p><b>Verified setup:</b> ${esc(d.verifiedTechnicalFacts?.hard_rule||'Mixed/verified data only.')}</p></div></section>
<section class="section"><h2>Fundamental Analysis</h2><div class="grid">${metric('Market Cap',f.market_cap?Number(f.market_cap).toLocaleString('en-IN'):'N/A')}${metric('P/E',f.PE_ratio)}${metric('P/B',f.PB_ratio)}${metric('ROE',f.ROE)}</div></section>
<section class="section"><h2>📰 News & Market Context — Old → Latest</h2><div class="news">${currentNews.length?currentNews.map(n=>`<div class="newsrow"><b>${n.published_at?new Date(n.published_at).toLocaleDateString('en-IN'):'Date N/A'}</b> — ${esc(n.title)}<br><a href="${esc(n.url)}" target="_blank" rel="noopener">Source: ${esc(n.provider||n.publisher||'Open source')}</a></div>`).join(''):'<div class="card">No dated news available.</div>'}</div></section>
<section class="section"><h2>🎯 Final Decision</h2><div class="card"><div class="decision ${cls}">${rec}</div><p>${esc(j.report||'Decision based on verified data.')}</p></div></section>
<section class="section"><h2>Scores & Data Quality</h2><table><tr><th>Component</th><th>Score</th></tr><tr><td>Technical</td><td>${esc(sc.technical)}</td></tr><tr><td>Fundamental</td><td>${esc(sc.fundamental)}</td></tr><tr><td>Sentiment</td><td>${esc(sc.sentiment)}</td></tr><tr><td>Market/Sector</td><td>${esc(sc.market_sector)}</td></tr></table></section>
<section class="section"><h2>Sources</h2><div class="card">${(d.sources||[]).map(x=>`<div>• <a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.provider||x.publisher||'Source')}</a>${x.published_at?' — '+new Date(x.published_at).toLocaleDateString('en-IN'):''}</div>`).join('')}</div></section>`}
function renderNewsRows(){if(!currentNews.length)return'<div class="news-empty">No verified news available for this stock.</div>';return currentNews.map((n,idx)=>{const label=newsSentiment(n.title);const hidden=idx>=6?' hidden-news':'';return`<div class="news-item${hidden}" data-news-index="${idx}"><div class="news-main"><a class="news-headline" href="${esc(n.url)}" target="_blank" rel="noopener">${esc(n.title)}</a><div class="news-meta"><span class="news-source">${esc(n.publisher||n.provider||'Verified source')}</span> · ${formatNewsDate(n.published_at)} · ${relativeTime(n.published_at)}</div></div><div class="news-sentiment ${sentimentClass(label)}">${label}</div></div>`}).join('')}
function toggleMoreNews(){document.querySelectorAll('.hidden-news').forEach(x=>x.classList.toggle('hidden-news'));const b=document.querySelector('.news-more');if(b)b.textContent=b.textContent==='More'?'Less':'More'}
function refreshNews(){const b=document.querySelector('.news-refresh');if(b){b.disabled=true;b.textContent='↻'}analyze().finally(()=>{if(b){b.disabled=false;b.textContent='↻'}})}
function metric(a,b){return `<div class="card"><div class="label">${a}</div><div class="value">${esc(b)}</div></div>`}function money(x){return x==null?'N/A':'₹'+Number(x).toLocaleString('en-IN',{maximumFractionDigits:2})}function num(x){return x==null?'N/A':Number(x).toFixed(2)}function summary(t,f,r){return `${t.trend||'Unknown'} technical setup. Price ${money(t.current_price)}; RSI ${num(t.indicators?.RSI_14)}. Fundamental data should be judged with available verified fields only. Current deterministic decision: ${r}.`}
document.getElementById('symbol').addEventListener('keydown',e=>{if(e.key==='Enter')analyze()});
analyze();
</script>
</body>
</html>
