<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pro-PRAN AI — Stock Research</title>
<style>
:root{--bg:#07111f;--card:#0d1b2d;--line:#20334d;--text:#e8f0fa;--muted:#8fa4bd;--accent:#4da3ff;--good:#35d07f;--bad:#ff6174;--warn:#ffc857}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,sans-serif;overflow-x:hidden}header{padding:22px max(20px,calc((100% - 1180px)/2));border-bottom:1px solid var(--line);background:#091626;position:sticky;top:0;z-index:5}h1{margin:0 0 5px;font-size:24px}.sub{color:var(--muted)}main{max-width:1180px;margin:24px auto;padding:0 20px}.search{display:flex;gap:10px;margin-bottom:22px}.search input{flex:1;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;color:var(--text);font-size:16px}.search button{border:0;border-radius:10px;padding:0 24px;background:var(--accent);color:#fff;font-weight:700;cursor:pointer}.status{color:var(--muted);margin:10px 0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}.label{font-size:12px;color:var(--muted);text-transform:uppercase}.value{font-size:21px;font-weight:750;margin-top:7px}.section{margin-top:18px}.section h2{font-size:18px;margin:0 0 10px}.report{line-height:1.65;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px}.report h3{margin:20px 0 8px;font-size:17px}.report p{margin:8px 0}.report ul{margin:8px 0 12px;padding-left:22px}.report li{margin:4px 0}.news{display:grid;gap:9px}.news a,.report a{color:#9dccff;text-decoration:none}.newsrow{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;min-width:0}.newsrow a,.source-link{display:inline-block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom}.decision{font-size:25px;font-weight:800}.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}table{width:100%;border-collapse:collapse;background:var(--card);border-radius:12px;overflow:hidden}th,td{text-align:left;padding:11px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-size:12px}.error{color:var(--bad)}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.search{flex-direction:column}.search button{height:48px}.value{font-size:18px}}@media(max-width:500px){.grid{grid-template-columns:1fr}main{padding:0 12px}}
</style></head>
<body><header><h1>📊 Pro-PRAN AI</h1><div class="sub">Verified stock research • Technical • Fundamental • News • AI decision</div></header>
<main><div class="search"><input id="symbol" value="IDEA" placeholder="Enter NSE symbol e.g. INFY, IDEA, RELIANCE"><button onclick="analyze()">Analyze Stock</button></div><div id="status" class="status">Ready</div><div id="app"></div></main>
<script>
const API='';
function esc(x){return String(x??'N/A').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[m]))}
function linkify(text){const escaped=esc(text);return escaped.replace(/https?:\/\/[^\s<]+/g,(url)=>{const clean=url.replace(/[),.;:]+$/,'');return `<a class="source-link" href="${clean}" target="_blank" rel="noopener noreferrer" title="Open source">Open Article ↗</a>${url.slice(clean.length)}`})}
function renderMarkdown(text){let html=linkify(String(text||'Decision based on verified data.'));html=html.replace(/^### (.+)$/gm,'<h3>$1</h3>').replace(/^## (.+)$/gm,'<h3>$1</h3>').replace(/^# (.+)$/gm,'<h3>$1</h3>');html=html.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');html=html.replace(/^(?:- )(.*)$/gm,'<li>$1</li>');html=html.replace(/((?:<li>.*<\/li>\n?)+)/g,'<ul>$1</ul>');html=html.replace(/\n\n+/g,'</p><p>').replace(/\n/g,'<br>');return `<div class="report"><p>${html}</p></div>`}
async function analyze(){const s=document.getElementById('symbol').value.trim().toUpperCase();if(!s)return;document.getElementById('status').textContent='Fetching verified data and news…';document.getElementById('app').innerHTML='';try{const r=await fetch(`${API}/api/analyze?symbol=${encodeURIComponent(s)}`);const j=await r.json();if(!j.success)throw Error(j.error||'Analysis failed');render(j,s);document.getElementById('status').textContent=`Analysis completed • ${new Date().toLocaleString()}`}catch(e){document.getElementById('status').innerHTML=`<span class="error">${esc(e.message)}</span>`}}
function render(j,s){const d=j.data||{},q=d.quantData||{},t=q.technicals||{},i=t.indicators||{},f=q.fundamentals?.values||{},sc=d.deterministicScore||{};const news=(d.sources||[]).filter(x=>x.title&&x.url).sort((a,b)=>new Date(a.published_at||0)-new Date(b.published_at||0));const rec=(j.report||'').match(/\*\*(BUY|SELL|WAIT)[^*]*\*\*/)?.[1]||'WAIT';const cls=rec==='BUY'?'good':rec==='SELL'?'bad':'warn';document.getElementById('app').innerHTML=`
<section class="section"><div class="card"><div class="label">Executive Summary</div><div class="value">${esc(s)} — ${esc(t.trend||'N/A')}</div><p>${esc(summary(t,f,rec))}</p></div></section>
<section class="section"><h2>Key Metrics Snapshot</h2><div class="grid">${metric('Current Price',money(t.current_price))}${metric('Trend',t.trend)}${metric('RSI (14)',i.RSI_14)}${metric('P/E',f.PE_ratio)}</div></section>
<section class="section"><h2>Technical Analysis</h2><div class="card"><p><b>EMA Stack:</b> Price ${money(t.current_price)} → EMA20 ${num(i.EMA_20)} → EMA50 ${num(i.EMA_50)} → EMA200 ${num(i.EMA_200)}</p><p><b>Momentum:</b> RSI ${num(i.RSI_14)} • MACD Histogram ${num(i.MACD_Histogram)} • Volume Ratio ${num(i.Volume_Ratio)}</p><p><b>Verified setup:</b> ${esc(d.verifiedTechnicalFacts?.hard_rule||'Mixed/verified data only.')}</p></div></section>
<section class="section"><h2>Fundamental Analysis</h2><div class="grid">${metric('Market Cap',f.market_cap?Number(f.market_cap).toLocaleString('en-IN'):'N/A')}${metric('P/E',f.PE_ratio)}${metric('P/B',f.PB_ratio)}${metric('ROE',f.ROE)}</div></section>
<section class="section"><h2>📰 News & Market Context — Old → Latest</h2><div class="news">${news.length?news.map(n=>`<div class="newsrow"><b>${n.published_at?new Date(n.published_at).toLocaleDateString('en-IN'):'Date N/A'}</b> — ${esc(n.title)}<br><a href="${esc(n.url)}" target="_blank" rel="noopener" class="source-link">${esc(n.provider||n.publisher||'Open Article')} ↗</a></div>`).join(''):'<div class="card">No dated news available.</div>'}</div></section>
<section class="section"><h2>🎯 Final Decision</h2><div class="card"><div class="decision ${cls}">${rec}</div>${renderMarkdown(j.report||'Decision based on verified data.')}</div></section>
<section class="section"><h2>Scores & Data Quality</h2><table><tr><th>Component</th><th>Score</th></tr><tr><td>Technical</td><td>${esc(sc.technical)}</td></tr><tr><td>Fundamental</td><td>${esc(sc.fundamental)}</td></tr><tr><td>Sentiment</td><td>${esc(sc.sentiment)}</td></tr><tr><td>Market/Sector</td><td>${esc(sc.market_sector)}</td></tr></table></section>
<section class="section"><h2>Sources</h2><div class="card">${(d.sources||[]).map(x=>`<div>• <a class="source-link" href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">${esc(x.provider||x.publisher||'Source')} ↗</a>${x.published_at?' — '+new Date(x.published_at).toLocaleDateString('en-IN'):''}</div>`).join('')}</div></section>`}
function metric(a,b){return `<div class="card"><div class="label">${a}</div><div class="value">${esc(b)}</div></div>`}function money(x){return x==null?'N/A':'₹'+Number(x).toLocaleString('en-IN',{maximumFractionDigits:2})}function num(x){return x==null?'N/A':Number(x).toFixed(2)}function summary(t,f,r){return `${t.trend||'Unknown'} technical setup. Price ${money(t.current_price)}; RSI ${num(t.indicators?.RSI_14)}. Fundamental data should be judged with available verified fields only. Current deterministic decision: ${r}.`}
document.getElementById('symbol').addEventListener('keydown',e=>{if(e.key==='Enter')analyze()});
analyze();
</script></body></html>
