<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PRAN AI — Research Terminal</title>
<style>
:root{--bg:#f7f9fc;--panel:#ffffff;--panel2:#ffffff;--line:#d9e1ea;--text:#111827;--muted:#5f6b7a;--blue:#1769e0;--green:#14804a;--red:#c6283d;--amber:#a45b00;--shadow:0 8px 24px rgba(15,23,42,.08)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Inter,system-ui,-apple-system,Segoe UI,sans-serif}button,input{font:inherit}header{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}.nav{max-width:1280px;margin:auto;padding:15px 22px;display:flex;align-items:center;justify-content:space-between;gap:18px}.brand{display:flex;align-items:center;gap:11px;font-weight:800;font-size:18px}.logo{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,#55a9ff,#7c5cff);box-shadow:0 8px 25px #55a9ff33}.nav small{color:var(--muted)}main{max-width:1280px;margin:0 auto;padding:26px 22px 60px}.hero{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:22px}.eyebrow{color:var(--blue);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.12em}.hero h1{font-size:32px;margin:7px 0}.hero p{color:var(--muted);margin:0}.search{display:flex;gap:10px;max-width:680px}.search input{flex:1;min-width:0;background:#ffffff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;color:var(--text);outline:none}.search input:focus{border-color:var(--blue);box-shadow:0 0 0 3px #55a9ff18}.search button{border:0;border-radius:12px;padding:0 22px;background:var(--blue);color:#06101c;font-weight:800;cursor:pointer}.status{color:var(--muted);margin:10px 0 12px}.tabs{display:flex;gap:8px;margin:0 0 16px;flex-wrap:wrap}.tab{border:1px solid var(--line);background:#fff;color:var(--text);border-radius:10px;padding:9px 14px;font-weight:800;cursor:pointer}.tab.active{background:var(--blue);color:#fff;border-color:var(--blue)}.layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px}.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow)}.summary{display:flex;justify-content:space-between;gap:20px;align-items:center}.label{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em}.big{font-size:25px;font-weight:850;margin:5px 0}.decision{font-size:28px;font-weight:900}.good{color:var(--green)}.bad{color:var(--red)}.warn{color:var(--amber)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metric{padding:14px;border:1px solid var(--line);border-radius:13px;background:#f8fafc}.metric .value{font-size:20px;font-weight:800;margin-top:6px}.section{margin-top:16px}.section h2{font-size:15px;margin:0 0 10px}.report{line-height:1.65;color:#111827}.report h3{font-size:16px;color:#111827;margin:18px 0 7px}.report p{margin:7px 0}.report li{margin:5px 0}.news{display:grid;gap:9px}.newsrow{border:1px solid var(--line);background:#f8fafc;border-radius:12px;padding:12px;line-height:1.45}.newsrow b{color:#b9c7d8}.source-link,a{color:#9dccff;text-decoration:none}.source-link{display:inline-block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom}.side{display:grid;gap:12px;align-content:start}.score{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}.score:last-child{border-bottom:0}.pill{padding:5px 9px;border-radius:999px;background:#172231;color:#b8c7d8;font-size:12px;font-weight:700}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line);overflow-wrap:anywhere}th{color:var(--muted);font-size:11px;text-transform:uppercase}.error{color:var(--red)}@media(max-width:900px){.layout{grid-template-columns:1fr}.side{grid-template-columns:repeat(2,1fr)}.hero{display:block}.search{margin-top:18px}}@media(max-width:620px){main{padding:18px 12px 40px}.nav{padding:12px}.grid{grid-template-columns:repeat(2,1fr)}.side{grid-template-columns:1fr}.search{flex-direction:column}.search button{height:48px}.hero h1{font-size:25px}.summary{display:block}}
.stock-search{position:relative;flex:1;min-width:0}.stock-search input{width:100%}.suggestions{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:50;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 35px rgba(15,23,42,.16);overflow:hidden;max-height:360px;overflow-y:auto}.suggestion{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer}.suggestion:last-child{border-bottom:0}.suggestion:hover,.suggestion.active{background:#f3f7ff}.suggestion-main{font-weight:800}.suggestion-sub{font-size:12px;color:var(--muted);margin-top:3px}.suggestion-badge{font-size:11px;color:var(--muted);white-space:nowrap}</style></head>
<body><header><div class="nav"><div class="brand"><span class="logo">✦</span> PRAN AI</div><small>Verified Stock Research</small></div></header>
<main><div class="hero"><div><div class="eyebrow">AI शेयर विश्लेषण</div><h1>शेयर की आसान रिपोर्ट</h1><p>टेक्निकल • फंडामेंटल • न्यूज़ • मार्केट</p></div><div class="search"><div class="stock-search"><input id="symbol" value="" autocomplete="off" placeholder="शेयर नाम / NSE Symbol लिखें — जैसे INFY, IDEA, RELIANCE"><div id="suggestions" class="suggestions" hidden></div></div><button onclick="analyze()">Analyze →</button></div></div><div id="status" class="status">तैयार</div><div class="tabs"><button id="summaryTab" class="tab active">📊 Total Summary</button><button id="quarterlyTab" class="tab">📈 Quarterly Results</button></div><div id="app"></div></main>
<script>
const API='';
function esc(x){return String(x??'N/A').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[m]))}
function safeUrl(u){try{const x=new URL(String(u));return /^https?:$/.test(x.protocol)?x.href:''}catch{return ''}}
function linkify(text){let s=String(text??'');s=s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,(m,label,url)=>{const href=safeUrl(url);return href?`<a class="source-link" href="${esc(href)}" target="_blank" rel="noopener noreferrer">${esc(label)} ↗</a>`:esc(m)});const parts=s.split(/(https?:\/\/[^\s<]+)/g);return parts.map((part,i)=>{if(i%2===0)return esc(part);const clean=part.replace(/[),.;:]+$/,'');const href=safeUrl(clean);if(!href)return esc(part);return `<a class="source-link" href="${esc(href)}" target="_blank" rel="noopener noreferrer">Open Article ↗</a>${esc(part.slice(clean.length))}`}).join('')}
function renderMarkdown(text){let html=linkify(String(text||'Decision based on verified data.'));html=html.replace(/^### (.+)$/gm,'<h3>$1</h3>').replace(/^## (.+)$/gm,'<h3>$1</h3>').replace(/^# (.+)$/gm,'<h3>$1</h3>');html=html.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');html=html.replace(/^(?:- )(.*)$/gm,'<li>$1</li>');html=html.replace(/((?:<li>.*<\/li>\n?)+)/g,'<ul>$1</ul>');html=html.replace(/\n\n+/g,'</p><p>').replace(/\n/g,'<br>');return html}

let stockUniverse=[];
let selectedStock=null;
let searchTimer=null;
async function loadStockUniverse(){
 try{
  const r=await fetch('/stock-universe.json?ts='+Date.now(),{cache:'no-store'});
  const j=await r.json();
  stockUniverse=Array.isArray(j.stocks)?j.stocks:[];
 }catch(e){stockUniverse=[];}
}
function cleanSearch(s){return String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'')}
function levenshtein(a,b){
 const m=a.length,n=b.length,dp=Array.from({length:m+1},()=>Array(n+1).fill(0));
 for(let i=0;i<=m;i++)dp[i][0]=i;
 for(let j=0;j<=n;j++)dp[0][j]=j;
 for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)dp[i][j]=Math.min(dp[i-1][j]+1,dp[i][j-1]+1,dp[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
 return dp[m][n];
}
function stockMatches(query){
 const q=cleanSearch(query);
 if(!q)return [];
 const scored=stockUniverse.map(s=>{
   const sym=cleanSearch(s.symbol);
   let score=999;
   if(sym===q)score=0;
   else if(sym.startsWith(q))score=10+sym.length-q.length;
   else if(sym.includes(q))score=30+sym.indexOf(q);
   else{
     const maxDist=q.length<=4?1:q.length<=7?2:3;
     const d=levenshtein(q,sym.slice(0,Math.max(q.length,sym.length)));
     if(d<=maxDist)score=60+d*5+Math.abs(sym.length-q.length);
   }
   return score<999?{...s,score}:null;
 }).filter(Boolean).sort((a,b)=>a.score-b.score||a.symbol.localeCompare(b.symbol));
 return scored.slice(0,8);
}
function showSuggestions(list){
 const box=document.getElementById('suggestions');
 if(!list.length){box.hidden=true;box.innerHTML='';return;}
 box.innerHTML=list.map((s,i)=>`<div class="suggestion" data-symbol="${esc(s.symbol)}" data-index="${i}"><div><div class="suggestion-main">${esc(s.symbol)}</div><div class="suggestion-sub">${esc(s.symbol)} • NSE • Verified universe</div></div><span class="suggestion-badge">Select ↵</span></div>`).join('');
 box.hidden=false;
 box.querySelectorAll('.suggestion').forEach(el=>el.addEventListener('mousedown',e=>{
   e.preventDefault();selectStock(el.dataset.symbol);
 }));
}
function selectStock(symbol){
 const clean=cleanSearch(symbol);
 const found=stockUniverse.find(s=>cleanSearch(s.symbol)===clean);
 if(!found)return;
 selectedStock=found;
 document.getElementById('symbol').value=found.symbol;
 document.getElementById('suggestions').hidden=true;
 document.getElementById('status').textContent=`Selected: ${found.symbol} • NSE`;
}
async function searchStockSuggestions(){
 const input=document.getElementById('symbol'), q=input.value;
 selectedStock=null;
 if(cleanSearch(q).length<1){document.getElementById('suggestions').hidden=true;return;}
 if(!stockUniverse.length)await loadStockUniverse();
 showSuggestions(stockMatches(q));
}

let lastAnalysis=null;
function activateTab(name){
 const sb=document.getElementById('summaryTab'),qb=document.getElementById('quarterlyTab');
 sb.classList.toggle('active',name==='summary'); qb.classList.toggle('active',name==='quarterly');
 if(name==='summary'){
  if(lastAnalysis) render(lastAnalysis,document.getElementById('symbol').value.trim().toUpperCase());
  else document.getElementById('app').innerHTML='<div class="card muted">पहले शेयर Analyze करें।</div>';
 }else loadQuarterly();
}
async function loadQuarterly(){
 const s=document.getElementById('symbol').value.trim().toUpperCase();
 if(!s){document.getElementById('app').innerHTML='<div class="card muted">पहले शेयर का नाम / NSE Symbol लिखें।</div>';return;}
 document.getElementById('status').textContent='Quarterly Results fetch हो रहे हैं…';
 document.getElementById('app').innerHTML='<div class="card muted">Latest 2 reported quarters का Sales/Revenue और Net Profit data आ रहा है…</div>';
 try{
  const r=await fetch('/api/quarterly?symbol='+encodeURIComponent(s)+'&t='+Date.now(),{cache:'no-store'});
  const j=await r.json(); if(!r.ok||!j.success) throw Error(j.error||'Quarterly result unavailable');
  const rows=j.quarters||[];
  const cards=rows.map((q,n)=>'<div class="card"><div class="label">Quarter '+(n+1)+'</div><div class="big">'+esc(q.quarter_end||'N/A')+'</div><div class="grid">'+metric('Revenue / Sales',money(q.revenue))+metric('Net Profit',money(q.net_profit))+metric('QoQ Revenue',q.qoq_revenue_pct==null?'N/A':q.qoq_revenue_pct+'%')+metric('QoQ Net Profit',q.qoq_net_profit_pct==null?'N/A':q.qoq_net_profit_pct+'%')+'</div></div>').join('');
  document.getElementById('app').innerHTML='<div class="section"><div class="card"><h2>📈 '+esc(s)+' — Quarterly Results</h2><p class="muted">'+esc(j.period||'Latest reported quarters')+' • Verified quarterly income-statement data</p></div></div>'+(cards||'<div class="card muted">Quarterly data उपलब्ध नहीं है।</div>')+'<div class="card"><p class="muted">'+esc(j.note||'Missing values remain N/A; no estimates are used.')+'</p></div>';
  document.getElementById('status').textContent='Quarterly Results ready • '+new Date().toLocaleString();
 }catch(e){document.getElementById('status').innerHTML='<span class="error">'+esc(e.message)+'</span>';document.getElementById('app').innerHTML='';}
}
async function analyze(){const s=document.getElementById('symbol').value.trim().toUpperCase();if(!s)return;document.getElementById('status').textContent='Fetching verified data and news…';document.getElementById('app').innerHTML='';try{const r=await fetch(`${API}/api/analyze?symbol=${encodeURIComponent(s)}`);const j=await r.json();if(!j.success)throw Error(j.error||'Analysis failed');lastAnalysis=j;render(j,s);document.getElementById('status').textContent=`विश्लेषण पूरा • ${new Date().toLocaleString()}`}catch(e){document.getElementById('status').innerHTML=`<span class="error">${esc(e.message)}</span>`}}
function render(j,s){const d=j.data||{},q=d.quantData||{},t=q.technicals||{},i=t.indicators||{},f=q.fundamentals?.values||{},sc=d.deterministicScore||{};const news=(d.sources||[]).filter(x=>x.title&&x.url).sort((a,b)=>new Date(a.published_at||0)-new Date(b.published_at||0));const rec=(j.report||'').match(/\*\*(BUY|SELL|WAIT)[^*]*\*\*/)?.[1]||'WAIT';const cls=rec==='BUY'?'good':rec==='SELL'?'bad':'warn';document.getElementById('app').innerHTML=`<div class="layout"><div><section class="card summary"><div><div class="label">मुख्य निष्कर्ष</div><div class="big">${esc(s)} <span class="pill">${esc(t.trend||'N/A')}</span></div><p>${esc(summary(t,f,rec))}</p></div><div><div class="label">Decision</div><div class="decision ${cls}">${rec}</div></div></section><section class="section"><div class="grid">${metric('वर्तमान भाव',money(t.current_price))}${metric('RSI (14)',i.RSI_14)}${metric('P/E',f.PE_ratio)}${metric('ROE',f.ROE)}</div></section><section class="section"><div class="card"><h2>टेक्निकल</h2><p><b>EMA Stack:</b> Price ${money(t.current_price)} → EMA20 ${num(i.EMA_20)} → EMA50 ${num(i.EMA_50)} → EMA200 ${num(i.EMA_200)}</p><p><b>Momentum:</b> RSI ${num(i.RSI_14)} • MACD Histogram ${num(i.MACD_Histogram)} • Volume Ratio ${num(i.Volume_Ratio)}</p><p><b>Verified setup:</b> ${esc(d.verifiedTechnicalFacts?.hard_rule||'Mixed/verified data only.')}</p></div></section><section class="section"><div class="card"><h2>फंडामेंटल</h2><div class="grid">${metric('Market Cap',f.market_cap?Number(f.market_cap).toLocaleString('en-IN'):'N/A')}${metric('P/E',f.PE_ratio)}${metric('P/B',f.PB_ratio)}${metric('ROE',f.ROE)}</div></div></section><section class="section"><div class="card"><h2>AI रिपोर्ट</h2><div class="report">${renderMarkdown(String(j.report||'Decision based on verified data.').slice(0,2200))}</div></div></section><section class="section"><div class="card"><h2>📰 News Timeline · Old → Latest</h2><div class="news">${news.length?news.map(n=>`<div class="newsrow"><b>${n.published_at?new Date(n.published_at).toLocaleDateString('en-IN'):'Date N/A'}</b> — ${esc(n.title)}<br><a href="${esc(safeUrl(n.url))}" target="_blank" rel="noopener noreferrer" class="source-link">${esc(n.provider||n.publisher||'Open Article')} ↗</a></div>`).join(''):'<div class="newsrow">No dated news available.</div>'}</div></div></section></div><aside class="side"><div class="card"><div class="label">स्कोर</div><div class="score"><span>Technical</span><b>${esc(sc.technical)}</b></div><div class="score"><span>Fundamental</span><b>${esc(sc.fundamental)}</b></div><div class="score"><span>Sentiment</span><b>${esc(sc.sentiment)}</b></div><div class="score"><span>Market / Sector</span><b>${esc(sc.market_sector)}</b></div></div><div class="card"><div class="label">रिपोर्ट गुणवत्ता</div><p>Verified evidence first. AI conclusion is shown after technical, fundamental and news context.</p><span class="pill">Live API data</span></div><div class="card"><div class="label">Sources</div>${(d.sources||[]).map(x=>{const href=safeUrl(x.url);return href?`<div style="margin-top:9px">• <a class="source-link" href="${esc(href)}" target="_blank" rel="noopener noreferrer">${esc(x.provider||x.publisher||'Source')} ↗</a></div>`:''}).join('')}</div></aside></div>`}
function metric(a,b){return `<div class="metric"><div class="label">${a}</div><div class="value">${esc(b)}</div></div>`}function money(x){return x==null?'N/A':'₹'+Number(x).toLocaleString('en-IN',{maximumFractionDigits:2})}function num(x){return x==null?'N/A':Number(x).toFixed(2)}function summary(t,f,r){return `${t.trend||'Unknown'} technical setup. Price ${money(t.current_price)}; RSI ${num(t.indicators?.RSI_14)}. Fundamental data should be judged with available verified fields only. Current deterministic decision: ${r}.`}
const symbolInput=document.getElementById('symbol');
symbolInput.addEventListener('input',()=>{clearTimeout(searchTimer);searchTimer=setTimeout(searchStockSuggestions,60);});
symbolInput.addEventListener('focus',()=>{if(symbolInput.value.trim())searchStockSuggestions()});
symbolInput.addEventListener('keydown',e=>{
 if(e.key==='Enter'){
   const first=document.querySelector('#suggestions .suggestion');
   if(!selectedStock && first){e.preventDefault();selectStock(first.dataset.symbol);return;}
   analyze();
 }
 if(e.key==='Escape')document.getElementById('suggestions').hidden=true;
});
document.addEventListener('click',e=>{
 const wrap=document.querySelector('.stock-search');
 if(wrap && !wrap.contains(e.target))document.getElementById('suggestions').hidden=true;
});
loadStockUniverse();document.getElementById('summaryTab').onclick=()=>activateTab('summary');document.getElementById('quarterlyTab').onclick=()=>activateTab('quarterly');
</script></body></html>
