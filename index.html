<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PRAN AI — Research Terminal</title>
<style>
:root{--bg:#070b12;--panel:#0d131d;--panel2:#111925;--line:#1d2938;--text:#f2f6fb;--muted:#8291a5;--blue:#55a9ff;--green:#36d98b;--red:#ff6578;--amber:#ffc857;--shadow:0 18px 50px rgba(0,0,0,.25)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% -10%,#142238 0,#070b12 38%);color:var(--text);font:14px Inter,system-ui,-apple-system,Segoe UI,sans-serif}button,input{font:inherit}header{position:sticky;top:0;z-index:10;background:rgba(7,11,18,.88);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}.nav{max-width:1280px;margin:auto;padding:15px 22px;display:flex;align-items:center;justify-content:space-between;gap:18px}.brand{display:flex;align-items:center;gap:11px;font-weight:800;font-size:18px}.logo{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,#55a9ff,#7c5cff);box-shadow:0 8px 25px #55a9ff33}.nav small{color:var(--muted)}main{max-width:1280px;margin:0 auto;padding:26px 22px 60px}.hero{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:22px}.eyebrow{color:var(--blue);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.12em}.hero h1{font-size:32px;margin:7px 0}.hero p{color:var(--muted);margin:0}.search{display:flex;gap:10px;max-width:680px}.search input{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;color:var(--text);outline:none}.search input:focus{border-color:var(--blue);box-shadow:0 0 0 3px #55a9ff18}.search button{border:0;border-radius:12px;padding:0 22px;background:var(--blue);color:#06101c;font-weight:800;cursor:pointer}.status{color:var(--muted);margin:10px 0 18px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px}.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow)}.summary{display:flex;justify-content:space-between;gap:20px;align-items:center}.label{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em}.big{font-size:25px;font-weight:850;margin:5px 0}.decision{font-size:28px;font-weight:900}.good{color:var(--green)}.bad{color:var(--red)}.warn{color:var(--amber)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metric{padding:14px;border:1px solid var(--line);border-radius:13px;background:#0b111a}.metric .value{font-size:20px;font-weight:800;margin-top:6px}.section{margin-top:16px}.section h2{font-size:15px;margin:0 0 10px}.report{line-height:1.65;color:#d9e2ec}.report h3{font-size:16px;color:#fff;margin:18px 0 7px}.report p{margin:7px 0}.report li{margin:5px 0}.news{display:grid;gap:9px}.newsrow{border:1px solid var(--line);background:#0b111a;border-radius:12px;padding:12px;line-height:1.45}.newsrow b{color:#b9c7d8}.source-link,a{color:#9dccff;text-decoration:none}.source-link{display:inline-block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom}.side{display:grid;gap:12px;align-content:start}.score{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}.score:last-child{border-bottom:0}.pill{padding:5px 9px;border-radius:999px;background:#172231;color:#b8c7d8;font-size:12px;font-weight:700}.error{color:var(--red)}@media(max-width:900px){.layout{grid-template-columns:1fr}.side{grid-template-columns:repeat(2,1fr)}.hero{display:block}.search{margin-top:18px}}@media(max-width:620px){main{padding:18px 12px 40px}.nav{padding:12px}.grid{grid-template-columns:repeat(2,1fr)}.side{grid-template-columns:1fr}.search{flex-direction:column}.search button{height:48px}.hero h1{font-size:25px}.summary{display:block}}
</style></head>
<body><header><div class="nav"><div class="brand"><span class="logo">✦</span> PRAN AI</div><small>Verified Stock Research Terminal</small></div></header>
<main><div class="hero"><div><div class="eyebrow">AI-powered Indian equity research</div><h1>Research a stock. Understand the decision.</h1><p>Technical • Fundamental • News • Market context • Evidence</p></div><div class="search"><input id="symbol" value="IDEA" placeholder="NSE symbol — INFY, IDEA, RELIANCE"><button onclick="analyze()">Analyze →</button></div></div><div id="status" class="status">Ready</div><div id="app"></div></main>
<script>
const API='';
function esc(x){return String(x??'N/A').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[m]))}
function safeUrl(u){try{const x=new URL(String(u));return /^https?:$/.test(x.protocol)?x.href:''}catch{return ''}}
function linkify(text){let s=String(text??'');s=s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,(m,label,url)=>{const href=safeUrl(url);return href?`<a class="source-link" href="${esc(href)}" target="_blank" rel="noopener noreferrer">${esc(label)} ↗</a>`:esc(m)});const parts=s.split(/(https?:\/\/[^\s<]+)/g);return parts.map((part,i)=>{if(i%2===0)return esc(part);const clean=part.replace(/[),.;:]+$/,'');const href=safeUrl(clean);if(!href)return esc(part);return `<a class="source-link" href="${esc(href)}" target="_blank" rel="noopener noreferrer">Open Article ↗</a>${esc(part.slice(clean.length))}`}).join('')}
function renderMarkdown(text){let html=linkify(String(text||'Decision based on verified data.'));html=html.replace(/^### (.+)$/gm,'<h3>$1</h3>').replace(/^## (.+)$/gm,'<h3>$1</h3>').replace(/^# (.+)$/gm,'<h3>$1</h3>');html=html.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');html=html.replace(/^(?:- )(.*)$/gm,'<li>$1</li>');html=html.replace(/((?:<li>.*<\/li>\n?)+)/g,'<ul>$1</ul>');html=html.replace(/\n\n+/g,'</p><p>').replace(/\n/g,'<br>');return html}
async function analyze(){const s=document.getElementById('symbol').value.trim().toUpperCase();if(!s)return;document.getElementById('status').textContent='Fetching verified data and news…';document.getElementById('app').innerHTML='';try{const r=await fetch(`${API}/api/analyze?symbol=${encodeURIComponent(s)}`,{headers:{Accept:'application/json'}});const text=await r.text();let j;try{j=JSON.parse(text)}catch{throw Error(`Server returned invalid response (${r.status})`)}if(!r.ok||!j.success)throw Error(j.error||'Analysis failed');render(j,s);document.getElementById('status').textContent=`Analysis completed • ${new Date().toLocaleString()}`}catch(e){document.getElementById('status').innerHTML=`<span class="error">${esc(e.message)}</span>`}}
function render(j,s){const d=j.data||{},q=d.quantData||{},t=q.technicals||{},i=t.indicators||{},f=q.fundamentals?.values||{},sc=d.deterministicScore||{};const news=(d.sources||[]).filter(x=>x.title&&x.url).sort((a,b)=>new Date(a.published_at||0)-new Date(b.published_at||0));const rec=(j.report||'').match(/\*\*(BUY|SELL|WAIT)[^*]*\*\*/)?.[1]||'WAIT';const cls=rec==='BUY'?'good':rec==='SELL'?'bad':'warn';document.getElementById('app').innerHTML=`<div class="layout"><div><section class="card summary"><div><div class="label">Executive Summary</div><div class="big">${esc(s)} <span class="pill">${esc(t.trend||'N/A')}</span></div><p>${esc(summary(t,rec))}</p></div><div><div class="label">Decision</div><div class="decision ${cls}">${rec}</div></div></section><section class="section"><div class="grid">${metric('Current Price',money(t.current_price))}${metric('RSI (14)',i.RSI_14)}${metric('P/E',f.PE_ratio)}${metric('ROE',f.ROE)}</div></section><section class="section"><div class="card"><h2>Technical Analysis</h2><p><b>EMA Stack:</b> Price ${money(t.current_price)} → EMA20 ${num(i.EMA_20)} → EMA50 ${num(i.EMA_50)} → EMA200 ${num(i.EMA_200)}</p><p><b>Momentum:</b> RSI ${num(i.RSI_14)} • MACD Histogram ${num(i.MACD_Histogram)} • Volume Ratio ${num(i.Volume_Ratio)}</p><p><b>Verified setup:</b> ${esc(d.verifiedTechnicalFacts?.hard_rule||'Mixed/verified data only.')}</p></div></section><section class="section"><div class="card"><h2>Fundamental Analysis</h2><div class="grid">${metric('Market Cap',f.market_cap?Number(f.market_cap).toLocaleString('en-IN'):'N/A')}${metric('P/E',f.PE_ratio)}${metric('P/B',f.PB_ratio)}${metric('ROE',f.ROE)}</div></div></section><section class="section"><div class="card"><h2>AI Research Report</h2><div class="report">${renderMarkdown(j.report||'Decision based on verified data.')}</div></div></section><section class="section"><div class="card"><h2>📰 News Timeline · Old → Latest</h2><div class="news">${news.length?news.map(n=>`<div class="newsrow"><b>${n.published_at?new Date(n.published_at).toLocaleDateString('en-IN'):'Date N/A'}</b> — ${esc(n.title)}<br><a href="${esc(safeUrl(n.url))}" target="_blank" rel="noopener noreferrer" class="source-link">${esc(n.provider||n.publisher||'Open Article')} ↗</a></div>`).join(''):'<div class="newsrow">No dated news available.</div>'}</div></div></section></div><aside class="side"><div class="card"><div class="label">Scorecard</div><div class="score"><span>Technical</span><b>${esc(sc.technical)}</b></div><div class="score"><span>Fundamental</span><b>${esc(sc.fundamental)}</b></div><div class="score"><span>Sentiment</span><b>${esc(sc.sentiment)}</b></div><div class="score"><span>Market / Sector</span><b>${esc(sc.market_sector)}</b></div></div><div class="card"><div class="label">Research quality</div><p>Verified evidence first. AI conclusion is shown after technical, fundamental and news context.</p><span class="pill">Live API data</span></div><div class="card"><div class="label">Sources</div>${(d.sources||[]).map(x=>{const href=safeUrl(x.url);return href?`<div style="margin-top:9px">• <a class="source-link" href="${esc(href)}" target="_blank" rel="noopener noreferrer">${esc(x.provider||x.publisher||'Source')} ↗</a></div>`:''}).join('')}</div></aside></div>`}
function metric(a,b){return `<div class="metric"><div class="label">${a}</div><div class="value">${esc(b)}</div></div>`}function money(x){return x==null?'N/A':'₹'+Number(x).toLocaleString('en-IN',{maximumFractionDigits:2})}function num(x){return x==null?'N/A':Number(x).toFixed(2)}function summary(t,r){return `${t.trend||'Unknown'} technical setup. Price ${money(t.current_price)}; RSI ${num(t.indicators?.RSI_14)}. Verified market data is used for the decision; unavailable fields are not estimated. Current decision: ${r}.`}
document.getElementById('symbol').addEventListener('keydown',e=>{if(e.key==='Enter')analyze()});analyze();
</script></body></html>
