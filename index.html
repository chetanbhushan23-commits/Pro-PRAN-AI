<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PRAN AI — Research Terminal</title>
<style>
:root{--bg:#070b12;--panel:#0d131d;--panel2:#111925;--line:#1d2938;--text:#f2f6fb;--muted:#8291a5;--blue:#55a9ff;--green:#36d98b;--red:#ff6578;--amber:#ffc857}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% -10%,#142238 0,#070b12 38%);color:var(--text);font:14px Inter,system-ui,sans-serif}button,input{font:inherit}header{background:#070b12e8;border-bottom:1px solid var(--line)}.nav{max-width:1280px;margin:auto;padding:15px 22px;display:flex;justify-content:space-between}.brand{font-weight:800;font-size:18px}.logo{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#55a9ff,#7c5cff);margin-right:10px}.nav small,.hero p,.status,.label{color:var(--muted)}main{max-width:1280px;margin:auto;padding:26px 22px}.hero{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:20px}.eyebrow{color:var(--blue);font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.hero h1{font-size:32px;margin:7px 0}.search{display:flex;gap:10px;max-width:680px}.search input{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;color:var(--text)}button{border:0;border-radius:12px;padding:0 22px;background:var(--blue);font-weight:800;cursor:pointer}.layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px}.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:16px;padding:18px}.summary{display:flex;justify-content:space-between;align-items:center}.big{font-size:25px;font-weight:850;margin:6px 0}.decision{font-size:28px;font-weight:900}.good{color:var(--green)}.bad{color:var(--red)}.warn{color:var(--amber)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px}.metric{padding:14px;border:1px solid var(--line);border-radius:13px;background:#0b111a}.value{font-size:20px;font-weight:800;margin-top:6px}.section{margin-top:16px}.section h2{font-size:15px}.report{line-height:1.65;color:#d9e2ec}.news{display:grid;gap:9px}.newsrow{border:1px solid var(--line);border-radius:12px;padding:12px}.source-link,a{color:#9dccff;text-decoration:none}.side{display:grid;gap:12px;align-content:start}.score{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}.pill{padding:5px 9px;border-radius:999px;background:#172231;color:#b8c7d8;font-size:12px}.error{color:var(--red)}.loading{opacity:.7}@media(max-width:900px){.layout{grid-template-columns:1fr}.hero{display:block}.search{margin-top:18px}}@media(max-width:620px){main{padding:18px 12px}.grid{grid-template-columns:repeat(2,1fr)}.search{flex-direction:column}.search button{height:48px}}
</style></head>
<body><header><div class="nav"><div class="brand"><span class="logo">✦</span>PRAN AI</div><small>Verified Stock Research Terminal</small></div></header>
<main><div class="hero"><div><div class="eyebrow">AI-powered Indian equity research</div><h1>Research a stock. Understand the decision.</h1><p>Technical • Fundamental • News • Market context • Evidence</p></div><div class="search"><input id="symbol" value="IDEA" placeholder="NSE symbol — INFY, IDEA, RELIANCE"><button id="analyzeBtn">Analyze →</button></div></div><div id="status" class="status">Ready</div><div id="app"></div></main>
<script>
const API_BASE='';
const $=id=>document.getElementById(id);
function esc(x){return String(x??'N/A').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[m]))}
function safeUrl(u){try{const x=new URL(String(u));return /^https?:$/.test(x.protocol)?x.href:''}catch{return ''}}
function money(x){return x==null||Number.isNaN(Number(x))?'N/A':'₹'+Number(x).toLocaleString('en-IN',{maximumFractionDigits:2})}
function num(x){return x==null||Number.isNaN(Number(x))?'N/A':Number(x).toFixed(2)}
function metric(a,b){return `<div class="metric"><div class="label">${esc(a)}</div><div class="value">${esc(b)}</div></div>`}
function reportHtml(text){let s=esc(text||'No research report returned.');s=s.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/^### (.+)$/gm,'<h3>$1</h3>').replace(/^## (.+)$/gm,'<h3>$1</h3>').replace(/(^|\n)- (.+)/g,'$1• $2');return s.replace(/\n\n/g,'<br><br>').replace(/\n/g,'<br>')}
async function analyze(){const s=$('symbol').value.trim().toUpperCase();if(!s)return;const btn=$('analyzeBtn');btn.disabled=true;btn.classList.add('loading');$('status').textContent=`Analyzing ${s} — fetching verified data…`;$('app').innerHTML='<div class="card">Loading market data, fundamentals and research evidence…</div>';try{const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),90000);let r;try{r=await fetch(`${API_BASE}/api/analyze?symbol=${encodeURIComponent(s)}`,{method:'GET',headers:{Accept:'application/json'},signal:controller.signal,cache:'no-store'})}finally{clearTimeout(timer)}const text=await r.text();let j;try{j=JSON.parse(text)}catch{throw new Error(`API returned non-JSON response (HTTP ${r.status}). Please check Railway logs.`)}if(!r.ok||j.success===false)throw new Error(j.error||j.message||`Analysis failed (HTTP ${r.status})`);render(j,s);$('status').textContent=`Analysis completed • ${new Date().toLocaleString('en-IN')}`}catch(e){const msg=e.name==='AbortError'?'Analysis timed out after 90 seconds.':e.message||'Unable to analyze this stock.';$('status').innerHTML=`<span class="error">${esc(msg)}</span>`;$('app').innerHTML=`<div class="card"><b>Analysis unavailable</b><p>${esc(msg)}</p><p class="label">Try again in a few seconds. If this repeats, check the Railway API logs.</p></div>`}finally{btn.disabled=false;btn.classList.remove('loading')}}
function render(j,s){const d=j.data||{},q=d.quantData||{},t=q.technicals||{},i=t.indicators||{},f=q.fundamentals?.values||{},sc=d.deterministicScore||{};const news=(d.sources||[]).filter(x=>x.title&&x.url).sort((a,b)=>new Date(a.published_at||0)-new Date(b.published_at||0));const rec=(j.report||'').match(/\*\*(BUY|SELL|WAIT)[^*]*\*\*/)?.[1]||'WAIT';const cls=rec==='BUY'?'good':rec==='SELL'?'bad':'warn';$('app').innerHTML=`<div class="layout"><div><section class="card summary"><div><div class="label">Executive Summary</div><div class="big">${esc(s)} <span class="pill">${esc(t.trend||'N/A')}</span></div><p>${esc(`${t.trend||'Unknown'} technical setup. Price ${money(t.current_price)}; RSI ${num(i.RSI_14)}. Verified market data is used for the decision.`)}</p></div><div><div class="label">Decision</div><div class="decision ${cls}">${rec}</div></div></section><div class="grid">${metric('Current Price',money(t.current_price))}${metric('RSI (14)',num(i.RSI_14))}${metric('P/E',f.PE_ratio)}${metric('ROE',f.ROE)}</div><section class="section"><div class="card"><h2>Technical Analysis</h2><p><b>EMA:</b> Price ${money(t.current_price)} → EMA20 ${num(i.EMA_20)} → EMA50 ${num(i.EMA_50)} → EMA200 ${num(i.EMA_200)}</p><p><b>Momentum:</b> RSI ${num(i.RSI_14)} • MACD Histogram ${num(i.MACD_Histogram)} • Volume Ratio ${num(i.Volume_Ratio)}</p><p><b>Verified setup:</b> ${esc(d.verifiedTechnicalFacts?.hard_rule||'Mixed/verified data only.')}</p></div></section><section class="section"><div class="card"><h2>Fundamental Analysis</h2><div class="grid" style="margin-top:0">${metric('Market Cap',f.market_cap?Number(f.market_cap).toLocaleString('en-IN'):'N/A')}${metric('P/E',f.PE_ratio)}${metric('P/B',f.PB_ratio)}${metric('ROE',f.ROE)}</div></div></section><section class="section"><div class="card"><h2>AI Research Report</h2><div class="report">${reportHtml(j.report)}</div></div></section><section class="section"><div class="card"><h2>📰 News Timeline · Old → Latest</h2><div class="news">${news.length?news.map(n=>{const href=safeUrl(n.url);return `<div class="newsrow"><b>${n.published_at?new Date(n.published_at).toLocaleDateString('en-IN'):'Date N/A'}</b> — ${esc(n.title)}<br>${href?`<a class="source-link" href="${esc(href)}" target="_blank" rel="noopener noreferrer">${esc(n.provider||n.publisher||'Open Article')} ↗</a>`:''}</div>`}).join(''):'<div class="newsrow">No dated news available.</div>'}</div></div></section></div><aside class="side"><div class="card"><div class="label">Scorecard</div><div class="score"><span>Technical</span><b>${esc(sc.technical)}</b></div><div class="score"><span>Fundamental</span><b>${esc(sc.fundamental)}</b></div><div class="score"><span>Sentiment</span><b>${esc(sc.sentiment)}</b></div><div class="score"><span>Market / Sector</span><b>${esc(sc.market_sector)}</b></div></div><div class="card"><div class="label">Research quality</div><p>Verified evidence first. AI conclusion follows technical, fundamental and news context.</p><span class="pill">Live API data</span></div></aside></div>`}
$('analyzeBtn').addEventListener('click',analyze);$('symbol').addEventListener('keydown',e=>{if(e.key==='Enter')analyze()});
analyze();
</script></body></html>
